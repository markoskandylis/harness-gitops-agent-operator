---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - argoproj.io
  resources:
  - appprojects
  verbs:
  - get
- apiGroups:
  - gitops.harness.io
  resources:
  - harnessgitopsagents
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - gitops.harness.io
  resources:
  - harnessgitopsagents/finalizers
  - harnessgitopsprojectmappings/finalizers
  verbs:
  - update
- apiGroups:
  - gitops.harness.io
  resources:
  - harnessgitopsagents/status
  - harnessgitopsprojectmappings/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - gitops.harness.io
  resources:
  - harnessgitopsprojectmappings
  verbs:
  - delete
  - get
  - list
  - patch
  - update
  - watch
