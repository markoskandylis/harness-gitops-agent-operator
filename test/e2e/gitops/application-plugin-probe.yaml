apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hga-mapping-plugin-probe
  namespace: controller-e2e
  labels:
    infrastructure.harness.io/test: plugin-probe
spec:
  project: default
  source:
    repoURL: https://git0.harness.io/l7B_kbSEQD2wjrM7PShm5w/PROD/Harness_Commons/harness-gitops-agent-operator.git
    targetRevision: HEAD
    path: test/e2e/gitops/plugin-probe
    plugin: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: plugin-probe-e2e
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
