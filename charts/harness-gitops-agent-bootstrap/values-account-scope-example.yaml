# ACCOUNT-scope Agent with two project mappings.
#
# This is the shape that B12 existed to make possible. An ACCOUNT-scoped agent
# is registered at account level and therefore has NO org of its own:
# gitopsAgent.harness.identity.orgIdentifier is left empty and the rendered CR
# carries no spec.orgId. The org that owns the MAPPED project is a property of
# the mapping, not of the agent, so it has to be supplied here.
#
# Every Mapping requires its own orgId/projectId pair; the render hard-fails if
# either is missing.
#
#   helm dependency build .
#   helm upgrade --install account-agent . \
#     --namespace account-agent-ns --create-namespace \
#     --values values-account-scope-example.yaml

harnessAgent:
  metadata:
    name: account-agent
  spec:
    name: account-agent
    scope: ACCOUNT
    # This Secret lives in the namespace configured on the controller, not
    # necessarily in this bootstrap release namespace.
    apiKeySecretRef: harness-api-key-secret
    tokenSecretRef: account-agent-token

# ACCOUNT scope is the many-project case: each Mapping carries its complete
# Harness target and all Mapping resources reference the same Agent CR.
projectMappings:
  - name: platform-payments
    appProject: payments
    orgId: platform
    projectId: payments
    autoCreateServiceEnv: false

  - name: commerce-orders
    appProject: orders
    orgId: commerce
    projectId: orders
    autoCreateServiceEnv: true
    # Optional: claim this exact pre-existing Harness mapping after full tuple
    # verification. Leave absent to create or observe without adoption.
    # adoptMappingId: existing-orders-mapping-id

gitopsAgent:
  enabled: true
  argo-cd:
    crds:
      install: true
  harness:
    identity:
      accountIdentifier: your-account-id
      # Both empty at ACCOUNT scope. This is the point of the scope, not an
      # omission: the agent serves projects across many orgs.
      orgIdentifier: ""
      projectIdentifier: ""
      agentIdentifier: account_agent
  agent:
    harnessName: account-agent
    existingSecrets:
      # Must equal harnessAgent.spec.tokenSecretRef.
      agentToken: account-agent-token

appProject:
  # This convenience creates only one AppProject and requires its CRD to exist
  # before Helm renders it. Create the named AppProjects separately here.
  enabled: false
