apiVersion: v2
name: harness-gitops-agent-bootstrap
description: Bootstrap one Harness GitOps Agent, its project mappings, and the official runtime managed by the harness-gitops-agent-operator.
type: application
version: 0.4.0
appVersion: "v0.121.0"
keywords:
  - harness
  - gitops
  - argo-cd
  - bootstrap
dependencies:
  - name: gitops-helm
    alias: gitopsAgent
    version: "1.2.7"
    repository: "https://harness.github.io/gitops-helm/"
    condition: gitopsAgent.enabled
