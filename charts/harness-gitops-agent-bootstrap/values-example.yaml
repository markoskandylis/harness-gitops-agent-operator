# Example values for one Harness GitOps Agent instance.
#
# Copy this file, replace every placeholder, then:
#
#   helm dependency build .
#   helm upgrade --install my-agent . \
#     --namespace my-agent-ns --create-namespace \
#     --values my-values.yaml --wait --timeout 10m
#
# Prerequisites: the harness-gitops-agent-operator controller is running, and
# Secret harness-api-key-secret (key: api_key) exists in the API-key namespace
# configured on that controller (its Helm release namespace by default). The
# runtime pods may briefly wait for the token Secret while the controller
# registers the Agent. Run one Agent per namespace.

harnessAgent:
  metadata:
    name: example-agent
  spec:
    name: example-agent
    scope: PROJECT # PROJECT | ORG | ACCOUNT
    apiKeySecretRef: harness-api-key-secret
    tokenSecretRef: example-agent-token

# At PROJECT scope orgId/projectId are inherited from the Agent. Each entry is
# independently reconciled and may optionally adopt one exact existing mapping.
projectMappings:
  - name: default
    appProject: default
    autoCreateServiceEnv: false
    # adoptMappingId: existing-harness-mapping-id

gitopsAgent:
  enabled: true
  argo-cd:
    # Set false when the cluster already has the Argo CRDs (existing Argo CD
    # or another agent instance).
    crds:
      install: true
  harness:
    identity:
      accountIdentifier: your-account-id
      orgIdentifier: your-org-id
      # Required for PROJECT scope; leave "" for ORG or ACCOUNT scope.
      projectIdentifier: your-project-id
      agentIdentifier: example_agent
  agent:
    # Unique per install on the same cluster (names the agent ClusterRole).
    harnessName: example-agent
    existingSecrets:
      # Must equal harnessAgent.spec.tokenSecretRef.
      agentToken: example-agent-token

appProject:
  # Keep false on a clean cluster. After this install creates the Argo CRD, a
  # later Helm upgrade can enable the convenience AppProject resource.
  enabled: false
